<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Oylik Ijara Nazorati</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; padding-bottom: 90px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .month-picker { background: var(--card); border: 1px solid var(--card-border); color: var(--text); padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; outline: none; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat-card { background: var(--card); border: 1px solid var(--card-border); padding: 12px 10px; border-radius: 14px; text-align: center; }
    .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-val { font-size: 14px; font-weight: 700; }
    .stat-val.paid { color: var(--success); }
    .stat-val.unpaid { color: var(--warning); }

    .search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .search-input { flex: 1; background: var(--card); border: 1px solid var(--card-border); color: var(--text); padding: 11px 14px; border-radius: 12px; font-size: 14px; outline: none; }
    .filter-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 8px; border-radius: 10px; background: var(--card); border: 1px solid var(--card-border); color: var(--muted); font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; transition: 0.2s; }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .client-list { display: flex; flex-direction: column; gap: 10px; }
    .client-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; transition: 0.2s; }
    .client-card.paid-card { border-color: rgba(16, 185, 129, 0.45); background: linear-gradient(145deg, #1e293b 0%, rgba(16, 185, 129, 0.08) 100%); }
    
    .client-info { flex: 1; min-width: 0; }
    .client-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .client-loc { font-size: 13px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
    .client-price { font-size: 14px; font-weight: 700; color: #60a5fa; }
    .paid-date { font-size: 11px; color: var(--success); margin-top: 4px; font-weight: 500; }

    .actions { display: flex; align-items: center; gap: 8px; }
    .plus-btn { width: 46px; height: 46px; border-radius: 14px; border: 2px solid var(--card-border); background: #0f172a; color: var(--text); font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .plus-btn.is-paid { background: var(--success); border-color: var(--success); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35); }
    .edit-btn { background: transparent; border: none; color: var(--muted); font-size: 18px; padding: 6px; cursor: pointer; }

    .fab { position: fixed; bottom: 20px; left: 16px; right: 16px; background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 14px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4); cursor: pointer; z-index: 10; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; backdrop-filter: blur(4px); }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--card-border); border-radius: 20px; width: 100%; max-width: 400px; padding: 20px; }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    .form-group input { width: 100%; background: var(--bg); border: 1px solid var(--card-border); color: var(--text); padding: 12px; border-radius: 10px; font-size: 15px; outline: none; }
    .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
    .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-cancel { background: #334155; color: var(--text); }
    .btn-save { background: var(--accent); color: #fff; }
    .btn-delete { background: rgba(239, 68, 68, 0.15); color: var(--danger); margin-top: 10px; width: 100%; }
    .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">📋 Oylik Ijaralar</div>
    <input type="month" id="monthPicker" class="month-picker" />
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Jami summa</div>
      <div class="stat-val" id="totalAmount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Berildi (+)</div>
      <div class="stat-val paid" id="paidAmount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Qoldi</div>
      <div class="stat-val unpaid" id="unpaidAmount">0</div>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Klent ismi yoki manzili bo'yicha qidirish..." />
  </div>

  <div class="filter-tabs">
    <div class="tab active" data-filter="all">Barchasi (<span id="countAll">0</span>)</div>
    <div class="tab" data-filter="unpaid">Berilmagan (<span id="countUnpaid">0</span>)</div>
    <div class="tab" data-filter="paid">Berilgan + (<span id="countPaid">0</span>)</div>
  </div>

  <div class="client-list" id="clientList"></div>

  <button class="fab" id="addClientBtn">➕ Yangi klent qo'shish</button>

  <!-- Modal -->
  <div class="modal-backdrop" id="clientModal">
    <div class="modal">
      <div class="modal-title" id="modalTitle">Yangi klent qo'shish</div>
      <input type="hidden" id="clientId" />
      <div class="form-group">
        <label>Klent ismi (F.I.Sh yoki obyekt nomi)</label>
        <input type="text" id="clientName" placeholder="Masalan: Akmal aka" />
      </div>
      <div class="form-group">
        <label>Qayerdaligi (Manzil / Mo'ljal)</label>
        <input type="text" id="clientLocation" placeholder="Masalan: Jizzax sh., Mustaqillik ko'chasi" />
      </div>
      <div class="form-group">
        <label>Oylik ijara to'lovi (so'mda)</label>
        <input type="number" id="clientRent" placeholder="Masalan: 1500000" />
      </div>
      <div class="modal-btns">
        <button class="btn btn-cancel" id="closeModalBtn">Bekor qilish</button>
        <button class="btn btn-save" id="saveClientBtn">Saqlash</button>
      </div>
      <button class="btn btn-delete" id="deleteClientBtn" style="display:none;">🗑 Klentni bazadan o'chirish</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const STORAGE_KEY = 'ijara_clients_v1';
    const PAYMENTS_KEY = 'ijara_payments_v1';

    let clients = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || [
      { id: '1', name: 'Asosiy joy (150 kv)', location: 'Markaziy filial', rent: 1500000 },
      { id: '2', name: 'Anvar aka (Avtomoyka yonida)', location: 'Sh. Rashidov ko\'chasi', rent: 1200000 },
      { id: '3', name: 'Sardor (Do\'kon oldi)', location: 'Zargarlik mahallasi', rent: 800000 }
    ];
    let payments = JSON.parse(localStorage.getItem(PAYMENTS_KEY) || '{}');
    let currentFilter = 'all';

    const monthPicker = document.getElementById('monthPicker');
    const now = new Date();
    const currentYM = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    monthPicker.value = currentYM;

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(clients));
      localStorage.setItem(PAYMENTS_KEY, JSON.stringify(payments));
    }

    function formatSum(num) {
      return Number(num || 0).toLocaleString('uz-UZ') + " so'm";
    }

    function isPaid(clientId) {
      const ym = monthPicker.value;
      return !!(payments[ym] && payments[ym][clientId]);
    }

    function togglePayment(clientId) {
      const ym = monthPicker.value;
      if (!payments[ym]) payments[ym] = {};
      if (payments[ym][clientId]) {
        delete payments[ym][clientId];
      } else {
        const d = new Date();
        payments[ym][clientId] = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      saveData();
      render();
    }

    function render() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const listEl = document.getElementById('clientList');
      
      let total = 0, paidSum = 0, unpaidSum = 0;
      let countAll = clients.length, countPaid = 0, countUnpaid = 0;

      clients.forEach(c => {
        const rent = Number(c.rent) || 0;
        total += rent;
        if (isPaid(c.id)) {
          paidSum += rent;
          countPaid++;
        } else {
          unpaidSum += rent;
          countUnpaid++;
        }
      });

      document.getElementById('totalAmount').textContent = formatSum(total);
      document.getElementById('paidAmount').textContent = formatSum(paidSum);
      document.getElementById('unpaidAmount').textContent = formatSum(unpaidSum);
      document.getElementById('countAll').textContent = countAll;
      document.getElementById('countPaid').textContent = countPaid;
      document.getElementById('countUnpaid').textContent = countUnpaid;

      const filtered = clients.filter(c => {
        const matchesSearch = c.name.toLowerCase().includes(query) || c.location.toLowerCase().includes(query);
        if (!matchesSearch) return false;
        if (currentFilter === 'paid') return isPaid(c.id);
        if (currentFilter === 'unpaid') return !isPaid(c.id);
        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state">Klentlar topilmadi</div>`;
        return;
      }

      const ym = monthPicker.value;
      listEl.innerHTML = filtered.map(c => {
        const paid = isPaid(c.id);
        const paidTime = payments[ym]?.[c.id] || '';
        return `
          <div class="client-card ${paid ? 'paid-card' : ''}">
            <div class="client-info" onclick="openEditModal('${c.id}')">
              <div class="client-name">${escapeHtml(c.name)}</div>
              <div class="client-loc">📍 ${escapeHtml(c.location)}</div>
              <div class="client-price">💰 Oyiga: ${formatSum(c.rent)}</div>
              ${paid ? `<div class="paid-date">✅ Ijara berilgan: + (${paidTime})</div>` : ''}
            </div>
            <div class="actions">
              <button class="edit-btn" onclick="openEditModal('${c.id}')" title="Tahrirlash">✏️</button>
              <button class="plus-btn ${paid ? 'is-paid' : ''}" onclick="togglePayment('${c.id}')" title="Ijara berilganini belgilash">
                ${paid ? '✓' : '+'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    // Modal boshqaruvi
    const modal = document.getElementById('clientModal');
    document.getElementById('addClientBtn').addEventListener('click', () => {
      document.getElementById('modalTitle').textContent = "Yangi klent qo'shish";
      document.getElementById('clientId').value = '';
      document.getElementById('clientName').value = '';
      document.getElementById('clientLocation').value = '';
      document.getElementById('clientRent').value = '';
      document.getElementById('deleteClientBtn').style.display = 'none';
      modal.classList.add('open');
    });

    window.openEditModal = function(id) {
      const c = clients.find(x => x.id === id);
      if (!c) return;
      document.getElementById('modalTitle').textContent = "Klent ma'lumotlarini tahrirlash";
      document.getElementById('clientId').value = c.id;
      document.getElementById('clientName').value = c.name;
      document.getElementById('clientLocation').value = c.location;
      document.getElementById('clientRent').value = c.rent;
      document.getElementById('deleteClientBtn').style.display = 'block';
      modal.classList.add('open');
    };

    document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.remove('open'));

    document.getElementById('saveClientBtn').addEventListener('click', () => {
      const id = document.getElementById('clientId').value;
      const name = document.getElementById('clientName').value.trim();
      const location = document.getElementById('clientLocation').value.trim();
      const rent = Number(document.getElementById('clientRent').value);

      if (!name || !location || !rent) {
        alert("Iltimos, barcha maydonlarni to'ldiring!");
        return;
      }

      if (id) {
        const idx = clients.findIndex(x => x.id === id);
        if (idx > -1) clients[idx] = { id, name, location, rent };
      } else {
        clients.push({ id: String(Date.now()), name, location, rent });
      }

      saveData();
      modal.classList.remove('open');
      render();
    });

    document.getElementById('deleteClientBtn').addEventListener('click', () => {
      const id = document.getElementById('clientId').value;
      if (confirm("Haqiqatan ham bu klentni o'chirmoqchimisiz?")) {
        clients = clients.filter(x => x.id !== id);
        saveData();
        modal.classList.remove('open');
        render();
      }
    });

    document.getElementById('searchInput').addEventListener('input', render);
    monthPicker.addEventListener('change', render);

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        render();
      });
    });

    render();
  </script>
</body>
</html>
